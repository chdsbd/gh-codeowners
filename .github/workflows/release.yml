name: Release

# Pushing a version to main that has no tag yet tags the commit and drafts a
# release with the version's CHANGELOG.md section and a binary for each
# platform, named so `gh extension install chdsbd/gh-codeowners` finds them:
# gh-codeowners-<GOOS>-<GOARCH>, with .exe on Windows. Publish the draft to
# release it.
on:
  push:
    branches:
      - main

permissions: {}

# Two quick pushes shouldn't both see the version as untagged.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="v$version"
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "$tag already exists"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - if: steps.version.outputs.tag
        run: |
          s/release-notes "$TAG" > notes.md
          gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" --silent
          gh release create "$TAG" --draft --verify-tag --notes-file notes.md --title "$TAG"
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
  build:
    needs: draft
    if: needs.draft.outputs.tag
    strategy:
      matrix:
        include:
          # Linux builds use musl, so one static binary runs everywhere.
          - {
              platform: darwin-arm64,
              os: macos-latest,
              target: aarch64-apple-darwin,
            }
          - {
              platform: darwin-amd64,
              os: macos-latest,
              target: x86_64-apple-darwin,
            }
          - {
              platform: linux-amd64,
              os: ubuntu-latest,
              target: x86_64-unknown-linux-musl,
            }
          - {
              platform: linux-arm64,
              os: ubuntu-24.04-arm,
              target: aarch64-unknown-linux-musl,
            }
          - {
              platform: windows-amd64,
              os: windows-latest,
              target: x86_64-pc-windows-msvc,
              exe: .exe,
            }
          - {
              platform: windows-arm64,
              os: windows-latest,
              target: aarch64-pc-windows-msvc,
              exe: .exe,
            }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          EXE: ${{ matrix.exe }}
          TAG: ${{ needs.draft.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          if [[ "$TARGET" == *musl ]]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
          fi
          cargo build --release --locked --target "$TARGET"
          asset="gh-codeowners-$PLATFORM$EXE"
          cp "target/$TARGET/release/gh-codeowners$EXE" "$asset"
          gh release upload "$TAG" "$asset"
