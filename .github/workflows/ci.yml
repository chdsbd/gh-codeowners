name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Checking out a private repository needs read access.
permissions:
  contents: read

# Only main saves the Rust cache, so pull requests restore from it but
# don't fill the 10 GB repository limit with caches of their own.
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
  # The WebAssembly build, for the VS Code extension on platforms without
  # the native CLI.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check --manifest-path wasm/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path wasm/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path wasm/Cargo.toml
      - run: cargo build --locked --release --target wasm32-unknown-unknown --manifest-path wasm/Cargo.toml
