name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Checking out a private repository needs read access.
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --locked
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
  # The WebAssembly build, for the VS Code extension on platforms without
  # the native CLI.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - run: cargo fmt --check --manifest-path wasm/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path wasm/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path wasm/Cargo.toml
      - run: cargo build --locked --release --target wasm32-unknown-unknown --manifest-path wasm/Cargo.toml
