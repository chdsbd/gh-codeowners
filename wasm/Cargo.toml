[package]
name = "gh-codeowners-wasm"
version = "0.0.0"
edition = "2024"
publish = false
description = "gh-codeowners as WebAssembly, for the VS Code extension on platforms without the native CLI"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gh-codeowners = { path = ".." }
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Not part of the gh-codeowners package.
[workspace]
