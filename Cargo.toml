[package]
name = "gh-codeowners"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Count the files each CODEOWNERS rule owns, and find rules that own nothing"
license = "MIT"
repository = "https://github.com/chdsbd/gh-codeowners"
readme = "README.md"
keywords = ["codeowners", "github", "git"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github", "wasm"]

[dependencies]
memchr = "2.8.3"
memmap2 = "0.9.12"
regex = "1.13.1"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
# The VS Code extension bundles a build per platform, so keep it small.
strip = true
lto = true
codegen-units = 1
