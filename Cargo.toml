[package]
name = "gh-codeowners"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Count the files each CODEOWNERS rule owns, and find rules that own nothing"
license = "MIT"
repository = "https://github.com/chdsbd/gh-codeowners"
readme = "README.md"
keywords = ["codeowners", "github", "git"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github", "wasm"]

[dependencies]
annotate-snippets = "0.12.17"
anstream = "1"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = { version = "8.0.1", default-features = false }
line-index = "0.1.2"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
# The VS Code extension bundles a build per platform, so keep it small.
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
insta = "1.49.0"
