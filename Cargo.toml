[package]
name = "gh-codeowners"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Count the files each CODEOWNERS rule owns, and find rules that own nothing"
license = "MIT"
repository = "https://github.com/chdsbd/gh-codeowners"
readme = "README.md"
keywords = ["codeowners", "github", "git"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github", "wasm"]

[dependencies]
annotate-snippets = "0.12.17"
anstream = "1"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = { version = "8.0.1", default-features = false }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# WebAssembly can't read git's index, so its callers list the files.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
gix = { version = "0.90.0", default-features = false, features = ["index", "sha1", "sha256"] }

[profile.release]
# The VS Code extension bundles a build per platform, so keep it small.
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
insta = "1.49.0"
